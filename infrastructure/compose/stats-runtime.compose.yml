# M13 - Containerization Start
# Local Stats runtime Compose profile.
# Starts the single stats-runtime container against the configured database provider.
#
# Usage:
#   cp infrastructure/containers/stats/.env.container.example infrastructure/compose/.env.container
#   # Edit .env.container with real Azure SQL and secret values (never commit .env.container).
#   # The active runtime target is AzureSql; local Compose will fail fast without
#   # AZURE_SQL_CONNECTIONSTRING.
#   docker compose -f infrastructure/compose/stats-runtime.compose.yml up --build

services:

  # ---------------------------------------------------------------------------
  # stats-runtime: Single container - Stats Web + module APIs + Tesseract OCR
  # ---------------------------------------------------------------------------
  stats:
    build:
      context: ../..
      dockerfile: infrastructure/containers/stats/Dockerfile
    image: stats-runtime:local
    container_name: stats-runtime
    ports:
      - "${STATS_WEB_HOST_PORT:-8080}:${STATS_WEB_PORT:-8080}"
    env_file:
      - .env.container
    environment:
      ALLOW_OCR_FALLBACK: "${ALLOW_OCR_FALLBACK:-true}"
      OCR_ENGINE: "${OCR_ENGINE:-tesseract}"
      STATS_APP_ROOT: "${STATS_APP_ROOT:-/app}"
      STATS_RUNTIME_CONFIG: "${STATS_RUNTIME_CONFIG:-/app/config/stats.runtime.json}"
      STATS_PATHS_CONFIG: "${STATS_PATHS_CONFIG:-/app/config/stats.paths.json}"
      STATS_LOGGING_CONFIG: "${STATS_LOGGING_CONFIG:-/app/config/stats.logging.json}"
      STATS_STORAGE_PROVIDER: "${STATS_STORAGE_PROVIDER:-AzureBlobStorage}"
      STATS_VALIDATION_HANDOFF_DIR: "${STATS_VALIDATION_HANDOFF_DIR:-/app/apps/stats-data/data/validation-handoff}"
      STATS_DATA_PORT: "${STATS_DATA_PORT:-8018}"
      AZURE_STORAGE_ACCOUNT_NAME: "${AZURE_STORAGE_ACCOUNT_NAME:-}"
      AZURE_STORAGE_CONTAINER_NAME: "${AZURE_STORAGE_CONTAINER_NAME:-}"
      AZURE_STORAGE_BLOB_PREFIX: "${AZURE_STORAGE_BLOB_PREFIX:-intake}"
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_INCLUDE_CORRELATION_ID: "${LOG_INCLUDE_CORRELATION_ID:-true}"
      LOG_REDACT_SENSITIVE_VALUES: "${LOG_REDACT_SENSITIVE_VALUES:-true}"
      LOG_DESTINATION: "${LOG_DESTINATION:-stdout}"
      STATS_WEB_PORT: "${STATS_WEB_PORT:-8080}"
      TRANSACTION_EXTRACTION_PORT: "${TRANSACTION_EXTRACTION_PORT:-8016}"
      DATA_VALIDATION_PORT: "${DATA_VALIDATION_PORT:-8017}"
      # AzureSql is the active M9/M14 runtime target. Provide
      # AZURE_SQL_CONNECTIONSTRING in the ignored .env.container file.
      DATABASE_PROVIDER: "${DATABASE_PROVIDER:-AzureSql}"
      DATABASE_SCHEMA: "${DATABASE_SCHEMA:-dbo}"
      AZURE_SQL_CONNECTIONSTRING: "${AZURE_SQL_CONNECTIONSTRING:?Set AZURE_SQL_CONNECTIONSTRING in infrastructure/compose/.env.container}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${STATS_WEB_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Allows first-start Azure SQL readiness, identity DB init, Tesseract-loaded
      # module APIs, and Stats Web startup before Compose marks the container unhealthy.
      start_period: 90s
    restart: unless-stopped

# M13 End
