# M13 - Containerization Start
# Local full-stack Stats runtime Compose profile.
# Starts stats-db (PostgreSQL) and the single stats-runtime container.
#
# Usage:
#   cp infrastructure/containers/stats/.env.container.example infrastructure/compose/.env.container
#   # Edit .env.container with real values (never commit .env.container)
#   docker compose -f infrastructure/compose/stats-runtime.compose.yml up --build

services:

  # ---------------------------------------------------------------------------
  # stats-db: PostgreSQL database for Identity Access Module (M1)
  # M9 (Stats Data and Persistence) owns the full schema; M13 owns this runtime wiring.
  # ---------------------------------------------------------------------------
  stats-db:
    image: postgres:16-alpine
    container_name: stats-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statspass}
      POSTGRES_DB: ${POSTGRES_DB:-stats}
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stats} -d ${POSTGRES_DB:-stats}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # stats-runtime: Single container — Stats Web + module APIs + Tesseract OCR
  # ---------------------------------------------------------------------------
  stats:
    build:
      context: ../..
      dockerfile: infrastructure/containers/stats/Dockerfile
    image: stats-runtime:local
    container_name: stats-runtime
    depends_on:
      stats-db:
        condition: service_healthy
    ports:
      - "${STATS_WEB_PORT:-8080}:8080"
    env_file:
      - .env.container
    environment:
      # OCR is always enabled inside this container
      ALLOW_OCR_FALLBACK: "true"
      OCR_ENGINE: "tesseract"
      STATS_WEB_PORT: "8080"
      TRANSACTION_EXTRACTION_PORT: "8016"
      # Wire DATABASE_URL to the stats-db Compose service
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-stats}:${POSTGRES_PASSWORD:-statspass}@stats-db:5432/${POSTGRES_DB:-stats}"
      DB_HOST: "stats-db"
      DB_PORT: "5432"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  stats-db-data:
    name: stats-db-data

# M13 End
